[project]
name = "generals-companion"
version = "0.1.0"
description = "Quality-of-life tooling and BIG archive editor for C&C Generals and Zero Hour"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }

dependencies = [
    "PySide6>=6.6",
    "psutil>=5.9",
]

[project.optional-dependencies]
build = [
    "pyinstaller>=6.0",
]

[project.gui-scripts]
generals-companion = "gencompanion.app:main"

[tool.setuptools.packages.find]
include = ["gencompanion*"]
